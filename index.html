<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mina böcker</title>
  <meta name="theme-color" content="#7a4b2a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Mina böcker</h1>
    <div class="top-actions">
      <button id="syncBtn" class="sync-dot" aria-label="Synk" title="Synk"></button>
      <button id="meBtn" class="avatar-btn" aria-label="Byt användare"></button>
      <button id="menuBtn" class="icon-btn" aria-label="Meny">⋯</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="reading" aria-selected="true">Läser <span class="count"></span></button>
    <button role="tab" data-tab="shelf">Bokhylla <span class="count"></span></button>
    <button role="tab" data-tab="wishlist">Önskelista <span class="count"></span></button>
    <button role="tab" data-tab="read">Läst <span class="count"></span></button>
  </nav>

  <div class="people" id="people" aria-label="Visa för"></div>

  <div class="filter">
    <input id="filter" type="search" placeholder="Filtrera på titel eller författare…" aria-label="Filtrera">
  </div>

  <main id="list" class="list"></main>

  <button id="addBtn" class="fab" aria-label="Lägg till bok">＋</button>

  <!-- Lägg till -->
  <dialog id="addDialog">
    <form method="dialog" class="sheet" id="searchForm">
      <div class="sheet-head">
        <h2>Lägg till bok</h2>
        <button type="button" class="icon-btn" aria-label="Stäng" data-close>✕</button>
      </div>
      <label class="inline">För <select id="addFor"></select></label>
      <div class="search-row">
        <input id="q" type="search" placeholder="Titel, författare eller ISBN" autocomplete="off">
        <button type="button" id="scanBtn" class="btn" hidden>📷 Skanna</button>
      </div>
      <video id="scanVideo" playsinline muted hidden></video>
      <div id="results" class="results"></div>
      <button type="button" id="manualBtn" class="link-btn">Lägg till manuellt</button>
    </form>
  </dialog>

  <!-- Redigera -->
  <dialog id="editDialog">
    <form method="dialog" class="sheet" id="editForm">
      <div class="sheet-head">
        <h2 id="editTitle">Bok</h2>
        <button type="button" class="icon-btn" aria-label="Stäng" data-close>✕</button>
      </div>
      <div class="edit-grid">
        <img id="editCover" class="cover big" alt="">
        <div class="fields">
          <label>Titel <input name="title" required></label>
          <label>Författare <input name="authors"></label>
          <div class="three">
            <label>År <input name="year" inputmode="numeric"></label>
            <label>Sidor <input name="pages" inputmode="numeric"></label>
            <label>ISBN <input name="isbn" inputmode="numeric"></label>
          </div>
        </div>
      </div>
      <label class="check"><input type="checkbox" name="owned"> Finns i bokhyllan</label>

      <section class="member-section">
        <div class="member-tabs" id="memberTabs"></div>
        <fieldset class="status">
          <legend id="statusLegend">Läsning</legend>
          <label><input type="radio" name="status" value=""> Inget</label>
          <label><input type="radio" name="status" value="wishlist"> Önskar</label>
          <label><input type="radio" name="status" value="reading"> Läser</label>
          <label><input type="radio" name="status" value="read"> Läst</label>
        </fieldset>
        <label id="pageRow" class="inline">Kommit till sida <input name="page" inputmode="numeric" class="short"></label>
        <div class="stars-row"><span class="muted">Betyg</span><div class="stars" id="stars"></div></div>
        <label>Anteckningar <textarea name="notes" rows="2"></textarea></label>
      </section>

      <div class="actions">
        <button type="button" id="deleteBtn" class="btn danger">Ta bort</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Avbryt</button>
        <button value="save" class="btn primary" id="saveBtn">Spara</button>
      </div>
    </form>
  </dialog>

  <!-- Hur långt har man kommit -->
  <dialog id="progressDialog">
    <form method="dialog" class="sheet" id="progressForm">
      <div class="sheet-head">
        <h2 id="progressTitle">Hur långt?</h2>
        <button type="button" class="icon-btn" aria-label="Stäng" data-close>✕</button>
      </div>
      <p class="muted" id="progressBook"></p>
      <div class="progress-input">
        <button type="button" class="btn" data-step="-10">−10</button>
        <label class="page-big">Sida <input name="page" inputmode="numeric" autocomplete="off"></label>
        <span class="of">av <input name="pages" inputmode="numeric" placeholder="?" aria-label="Antal sidor"></span>
        <button type="button" class="btn" data-step="10">+10</button>
      </div>
      <input type="range" name="slider" min="0" max="100" step="1" aria-label="Sida">
      <p class="muted" id="othersProgress"></p>
      <div class="actions">
        <button type="button" id="finishBtn" class="btn">✓ Utläst</button>
        <span class="spacer"></span>
        <button value="save" class="btn primary">Spara</button>
      </div>
    </form>
  </dialog>

  <!-- Vem är du -->
  <dialog id="whoDialog">
    <form method="dialog" class="sheet" id="whoForm">
      <div class="sheet-head">
        <h2>Vem använder appen?</h2>
      </div>
      <p class="muted">Välj din profil på den här enheten. Du kan byta när som helst genom att trycka på din bild uppe till höger.</p>
      <div id="whoList" class="who-list"></div>
      <div class="search-row">
        <input id="newMemberName" placeholder="Nytt namn, t.ex. Matilda" autocomplete="off">
        <button type="button" id="addMemberBtn" class="btn">Lägg till</button>
      </div>
    </form>
  </dialog>

  <!-- Meny -->
  <dialog id="menuDialog">
    <form method="dialog" class="sheet" id="menuForm">
      <div class="sheet-head">
        <h2>Inställningar</h2>
        <button type="button" class="icon-btn" aria-label="Stäng" data-close>✕</button>
      </div>

      <h3>Synk mellan enheter</h3>
      <div id="syncPanel"></div>

      <h3>Familjen</h3>
      <div id="familyList" class="family-list"></div>

      <h3>Backup</h3>
      <div class="actions">
        <button type="button" id="exportBtn" class="btn">⬇ Exportera</button>
        <button type="button" id="importBtn" class="btn">⬆ Importera</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="muted" id="stats"></p>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase-2.45.4.js"></script>
  <script src="app.js"></script>
</body>
</html>
